version: 2
project_name: melisa

before:
  hooks:
    - go mod verify

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    main: ./cmd/melisa
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - NOTICE
    # this name template makes the archive name compatible with the standard
    # naming used by many package managers
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

nfpms:
  - package_name: melisa
    file_name_template: "{{ .ConventionalFileName }}"
    formats: [deb, rpm]
    maintainer: Sergey Ovchinnikov <sovchinnikov@gmail.com>
    homepage: https://github.com/snmp161/melisa
    description: Single-binary Linux performance diagnostics via eBPF/BCC, built for humans and AI agents (MCP)
    license: Apache-2.0
    section: utils
    priority: optional
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/melisa/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/melisa/NOTICE

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

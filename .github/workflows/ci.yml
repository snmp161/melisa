name: CI

on:
  push:
    branches: ["develop", "master"]
  pull_request:
    branches: ["develop", "master"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: make fmt-check

      - name: Check module files
        run: make tidy-check

      - name: Build
        run: go build -v ./...

      - name: Test
        run: make test

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Vulnerability check
        run: make vuln

  bpf-smoke:
    name: BPF object smoke build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"

      - name: Install BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm linux-tools-generic libbpf-dev
          sudo ln -sf $(ls /usr/lib/linux-tools/*/bpftool | head -n1) /usr/local/bin/bpftool

      - name: Generate embedded BPF objects
        run: make generate

      - name: Build with embedded objects
        run: go build -v ./...

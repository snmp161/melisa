name: CI

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["develop", "main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: make fmt-check

      - name: Check module files
        run: make tidy-check

      - name: Build
        run: go build -v ./...

      - name: Test
        run: make test

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Vulnerability check
        run: make vuln

  bpf-smoke:
    name: BPF object smoke build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"

      - name: Install BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm linux-tools-generic libbpf-dev
          if ! command -v bpftool >/dev/null 2>&1; then
            shopt -s nullglob
            candidates=(/usr/lib/linux-tools/*/bpftool)
            if [[ ${#candidates[@]} -eq 0 ]]; then
              echo "bpftool not found after installing linux-tools-generic" >&2
              exit 1
            fi
            sudo ln -sf "${candidates[0]}" /usr/local/bin/bpftool
          fi

      - name: Generate embedded BPF objects
        run: make generate

      - name: Build with embedded objects
        run: go build -v ./...

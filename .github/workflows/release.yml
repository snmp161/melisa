name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"

      - name: Install BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm linux-tools-generic libbpf-dev
          # linux-tools-generic installs bpftool under a kernel-versioned path;
          # expose it on PATH for `make generate`.
          sudo ln -sf $(ls /usr/lib/linux-tools/*/bpftool | head -n1) /usr/local/bin/bpftool

      - name: Generate embedded BPF objects
        run: make generate

      - name: Verify dependencies
        run: go mod verify

      - name: Run checks
        run: make check

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "v2.20.2"
          args: check

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "v2.20.2"
          args: release --clean --snapshot

      - name: Verify snapshot archives
        run: |
          set -euo pipefail
          for archive in dist/*.tar.gz; do
            contents="$(tar -tzf "$archive")"
            grep -Eq '(^|/)LICENSE$' <<<"$contents"
            grep -Eq '(^|/)NOTICE$' <<<"$contents"
          done

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "v2.20.2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
